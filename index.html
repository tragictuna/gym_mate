<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- 모바일 뷰포트: 헬스장에서 한 손으로 조작하는 화면 기준 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GymMate - 내 헬스장</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!--
    페이지 역할: 홈 = 내 헬스장
      - 등록 기구 목록(gm_equipment)을 보여 주고, 누르면 기구 카드가 펼쳐집니다(F1-5).
      - 기구마다 삭제 버튼이 있고 삭제 전에 확인을 받습니다(F1-4).
      - 상단 버튼: '기구 추가'(scan.html), '오늘 운동 시작'(routine.html — 2단계에서 구현)
    목록은 js/home.js가 textContent로만 그립니다(innerHTML 사용 안 함).
  -->
  <div class="app-container">

    <header class="app-header">
      <div class="logo-area">
        <span class="logo-icon">🏋️‍♂️</span>
        <h1 class="logo-title">GymMate</h1>
      </div>
      <p class="header-subtitle">순서의 이유까지 알려 주는 헬스 파트너</p>
    </header>

    <main class="main-content">

      <!-- 상단 행동 버튼 -->
      <section class="home-actions">
        <a href="routine.html" class="btn btn-primary" id="startWorkoutBtn">🔥 오늘 운동 시작</a>
        <a href="scan.html" class="btn btn-outline" id="addEquipmentBtn">➕ 기구 추가</a>
      </section>

      <!-- 등록 기구가 없을 때: 먼저 등록하라는 안내 -->
      <section class="card empty-state" id="emptyState" hidden>
        <div class="empty-icon">📷</div>
        <h2>아직 등록한 기구가 없어요</h2>
        <p>내 헬스장 기구를 먼저 찍어서 등록해 주세요.<br>등록한 기구만으로 오늘의 루틴을 만들어 드려요.</p>
        <a href="scan.html" class="btn btn-primary">첫 기구 등록하기</a>
      </section>

      <!-- 등록 기구 목록 -->
      <section class="equipment-section" id="equipmentSection" hidden>
        <h2 class="section-title">내 헬스장 <span class="section-count" id="equipmentCount"></span></h2>
        <ul class="equipment-list" id="equipmentList">
          <!-- js/home.js에서 기구별 항목 생성 -->
        </ul>
      </section>

      <!-- 오류 알림 (예: 삭제 저장 실패) -->
      <div class="error-banner" id="errorBanner" hidden>
        <span class="error-icon">⚠️</span>
        <div class="error-text-wrap">
          <p class="error-msg-title" id="errorTitle"></p>
          <p class="error-msg-desc" id="errorDesc"></p>
        </div>
        <button type="button" class="error-close-btn" id="errorCloseBtn" aria-label="닫기">&times;</button>
      </div>

    </main>

    <footer class="app-footer">
      <p>© 2026 GymMate</p>
    </footer>
  </div>

  <!-- 공통 저장소 모듈을 먼저 불러온 뒤 홈 스크립트를 불러옵니다. -->
  <script src="js/storage.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
